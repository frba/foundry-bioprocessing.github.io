name: Auto Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Next Version and Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch all tags
          git fetch --tags --force

          # Get the latest tag and calculate next tag
          if ! git describe --tags --abbrev=0 >/dev/null 2>&1; then
            NEW_TAG="v1.0.0"
            echo "No existing tags found. Creating first release: $NEW_TAG"
          else
            LATEST_TAG=$(git describe --tags --abbrev=0)
            echo "Latest tag found: $LATEST_TAG"
            
            # Remove 'v' prefix for parsing
            CLEAN_VERSION=${LATEST_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VERSION"
            
            MAJOR=${MAJOR:-1}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}

            COMMIT_MSG=$(git log -1 --pretty=%B)
            echo "Latest commit message: $COMMIT_MSG"
            
            if [[ "$COMMIT_MSG" == *"#major"* ]]; then
              NEW_MAJOR=$((MAJOR + 1))
              NEW_MINOR=0
              NEW_PATCH=0
              BUMP="major"
            elif [[ "$COMMIT_MSG" == *"#minor"* ]]; then
              NEW_MAJOR=$MAJOR
              NEW_MINOR=$((MINOR + 1))
              NEW_PATCH=0
              BUMP="minor"
            else
              NEW_MAJOR=$MAJOR
              NEW_MINOR=$MINOR
              NEW_PATCH=$((PATCH + 1))
              BUMP="patch"
            fi
            NEW_TAG="v$NEW_MAJOR.$NEW_MINOR.$NEW_PATCH"
            echo "Calculated $BUMP bump to version: $NEW_TAG"
          fi

          # Create Git tag and push it
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

          # Create a GitHub Release using the GitHub CLI
          gh release create "$NEW_TAG" \
            --title "Release $NEW_TAG" \
            --notes "Automated release triggered by commit: $(git log -1 --pretty=%s)"
